<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Magic Card</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #171717;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .app {
      width: min(100%, 500px);
      text-align: center;
    }

    .card-area {
      min-height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #card {
      display: none;
      max-width: 100%;
      max-height: 75vh;
      width: auto;
      height: auto;
      border-radius: 4.75%;
      box-shadow: 0 12px 35px rgba(0,0,0,.55);
    }

    #message {
      color: #bbb;
      font-size: 1rem;
    }

    button {
      margin-top: 18px;
      padding: 14px 28px;
      border: 0;
      border-radius: 8px;
      background: #f0f0f0;
      color: #111;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #fff; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .6; cursor: wait; }

    .credit {
      margin-top: 14px;
      font-size: .75rem;
      color: #777;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="card-area">
      <div id="message">Click the button to draw a random card.</div>
      <img id="card" alt="Random Magic: The Gathering card">
    </div>

    <button id="randomButton">Random Card</button>

    <div class="credit">
      Card data and images provided by Scryfall.
    </div>
  </main>

  <script>
    const button = document.getElementById("randomButton");
    const card = document.getElementById("card");
    const message = document.getElementById("message");

    async function randomCard() {
      button.disabled = true;
      button.textContent = "Loading...";
      message.textContent = "Drawing a random card...";
      card.style.display = "none";

      try {
        const response = await fetch("https://api.scryfall.com/cards/random", {
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("The card service returned an error.");
        }

        const data = await response.json();
        const imageUrl = data.image_uris?.normal || data.image_uris?.large;

        if (!imageUrl) {
          throw new Error("This card does not have an image.");
        }

        card.onload = () => {
          message.style.display = "none";
          card.style.display = "block";
        };

        card.src = imageUrl;
      } catch (error) {
        message.textContent =
          "Sorry, I couldn't draw a card right now. Please try again.";
        console.error(error);
      } finally {
        button.disabled = false;
        button.textContent = "Random Card";
      }
    }

    button.addEventListener("click", randomCard);
  </script>
</body>
</html>
