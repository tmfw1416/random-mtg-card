<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Random Magic Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #171717;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .app {
      width: min(100%, 500px);
      text-align: center;
    }

    /* Card information */

    #cardName {
      display: none;
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.2;
    }

    #setName {
      display: none;
      margin: 6px 0 15px;
      color: #aaa;
      font-size: 0.95rem;
    }

    /* Card */

    .card-area {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #card {
      display: none;
      max-width: 100%;
      max-height: 70vh;
      width: auto;
      height: auto;
      border-radius: 4.75%;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
    }

    #message {
      min-height: 25px;
      color: #bbb;
      font-size: 1rem;
    }

    /* Navigation buttons */

    .navigation {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      background: #f0f0f0;
      color: #111;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #ffffff;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #previousButton {
      display: none;
    }

    /* Links */

    .credit {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #777;
    }

    .external-links {
      display: none;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .external-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 145px;
      padding: 10px 14px;
      border-radius: 7px;
      background: #f0f0f0;
      color: #111;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .external-link:hover {
      background: #ffffff;
    }

    #tcgPrice {
      font-weight: normal;
      margin-left: 4px;
    }

    @media (max-width: 450px) {
      #cardName {
        font-size: 1.25rem;
      }

      .navigation button {
        flex: 1;
      }

      .external-links {
        flex-direction: column;
        align-items: center;
      }

      .external-link {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- Card name and set -->

    <h1 id="cardName"></h1>
    <div id="setName"></div>

    <!-- Card / loading message -->

    <div class="card-area">
      <div id="message">
        Click the button to draw a random card.
      </div>

      <img
        id="card"
        alt="Random Magic: The Gathering card"
      >
    </div>

    <!-- Previous / Random buttons -->

    <div class="navigation">

      <button id="previousButton">
        Previous Card
      </button>

      <button id="randomButton">
        Random Card
      </button>

    </div>

    <!-- Scryfall credit -->

    <div class="credit">
      Card data and images provided by Scryfall.
    </div>

    <!-- External links -->

    <div class="external-links" id="externalLinks">

      <a
        id="tcgLink"
        class="external-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Buy on TCGplayer
        <span id="tcgPrice"></span>
      </a>

      <a
        id="scryfallLink"
        class="external-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Scryfall
      </a>

    </div>

  </main>


  <script>

    const button = document.getElementById("randomButton");
    const previousButton = document.getElementById("previousButton");

    const card = document.getElementById("card");
    const message = document.getElementById("message");

    const cardName = document.getElementById("cardName");
    const setName = document.getElementById("setName");

    const externalLinks = document.getElementById("externalLinks");

    const tcgLink = document.getElementById("tcgLink");
    const tcgPrice = document.getElementById("tcgPrice");

    const scryfallLink = document.getElementById("scryfallLink");


    /*
     * Card history
     *
     * Each random card gets stored here so that
     * Previous Card can move backward through
     * cards that have already been displayed.
     */

    let cardHistory = [];

    let historyPosition = -1;


    /*
     * Draw a random English card
     */

    async function randomCard() {

      button.disabled = true;
      button.textContent = "Loading...";

      message.textContent = "Drawing a random card...";

      card.style.display = "none";

      cardName.style.display = "none";
      setName.style.display = "none";

      externalLinks.style.display = "none";


      try {

        /*
         * lang:en tells Scryfall to only return
         * English-language cards.
         */

        const response = await fetch(
          "https://api.scryfall.com/cards/random?q=lang%3Aen",
          {
            headers: {
              "Accept": "application/json"
            }
          }
        );


        if (!response.ok) {
          throw new Error(
            "The card service returned an error."
          );
        }


        const data = await response.json();


        /*
         * Save the card in our history.
         *
         * If the user previously clicked Previous Card,
         * discard the cards that were ahead of the current
         * position before adding the new random card.
         */

        if (historyPosition < cardHistory.length - 1) {

          cardHistory =
            cardHistory.slice(0, historyPosition + 1);

        }


        cardHistory.push(data);

        historyPosition =
          cardHistory.length - 1;


        displayCard(data);


      } catch (error) {

        message.textContent =
          "Sorry, I couldn't draw a card right now. Please try again.";

        console.error(error);

      } finally {

        button.disabled = false;
        button.textContent = "Random Card";

      }
    }


    /*
     * Display a card
     */

    function displayCard(data) {

      /*
       * Card image
       */

      let imageUrl =
        data.image_uris?.normal ||
        data.image_uris?.large;


      /*
       * Some Magic cards are double-faced.
       *
       * If there isn't a normal image on the main card,
       * try the first face.
       */

      if (!imageUrl && data.card_faces) {

        imageUrl =
          data.card_faces[0]?.image_uris?.normal ||
          data.card_faces[0]?.image_uris?.large;

      }


      if (!imageUrl) {

        message.textContent =
          "This card doesn't have an available image. Try again.";

        return;

      }


      /*
       * Card name
       */

      cardName.textContent =
        data.name || "Unknown Card";

      cardName.style.display = "block";


      /*
       * Set name
       */

      setName.textContent =
        data.set_name || "";

      setName.style.display = "block";


      /*
       * Card image
       */

      card.onload = () => {

        message.style.display = "none";
        card.style.display = "block";

      };

      card.src = imageUrl;


      /*
       * TCGplayer
       */

      if (data.tcgplayer_uri) {

        tcgLink.href = data.tcgplayer_uri;

        /*
         * Scryfall supplies the current USD price
         * when one is available.
         */

        if (data.prices?.usd) {

          tcgPrice.textContent =
            " ($" + data.prices.usd + ")";

        } else {

          tcgPrice.textContent =
            " (Price unavailable)";

        }

        tcgLink.style.display = "inline-flex";

      } else {

        tcgLink.style.display = "none";

      }


      /*
       * Scryfall link
       */

      if (data.scryfall_uri) {

        scryfallLink.href =
          data.scryfall_uri;

        scryfallLink.style.display =
          "inline-flex";

      } else {

        scryfallLink.style.display =
          "none";

      }


      /*
       * Show the external links.
       */

      externalLinks.style.display =
        "flex";


      /*
       * Previous button
       *
       * It remains hidden when this is the
       * first card in the history.
       */

      if (historyPosition > 0) {

        previousButton.style.display =
          "inline-block";

      } else {

        previousButton.style.display =
          "none";

      }

    }


    /*
     * Go back to the previous card
     */

    function previousCard() {

      if (historyPosition <= 0) {
        return;
      }


      historyPosition--;


      const data =
        cardHistory[historyPosition];


      displayCard(data);

    }


    /*
     * Button events
     */

    button.addEventListener(
      "click",
      randomCard
    );


    previousButton.addEventListener(
      "click",
      previousCard
    );

  </script>

</body>
</html>
