<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random MTG Card</title>
  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      background: #1b1b1b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }


    #cardName {
      margin: 0 0 4px;
      font-size: 28px;
    }

    #setName {
      margin: 0 0 15px;
      font-size: 18px;
      color: #bbb;
    }

    #cardImage {
      display: block;
      margin: 0 auto;
      max-width: 90%;
      width: 488px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .buttonRow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    button, .linkButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      box-sizing: border-box;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover, .linkButton:hover {
      background: #444;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #previousButton, #nextButton {
      display: none;
    }

    #purchaseLinks {
      margin-top: 20px;
    }

    .credit {
      margin-top: 20px;
      color: #999;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      #cardName {
        font-size: 23px;
      }

      #setName {
        font-size: 16px;
      }

      #cardImage {
        max-width: 95%;
      }
    }
  </style>
</head>
<body>

  <div id="cardName">Click "Random Card" to begin</div>
  <div id="setName"></div>

  <img id="cardImage" src="" alt="" style="display:none;">

  <div class="buttonRow">
    <button id="previousButton" onclick="showPreviousCard()">Previous Card</button>
    <button onclick="getRandomCard()">Random Card</button>
    <button id="nextButton" onclick="showNextCard()">Next Card</button>
  </div>

  <div id="purchaseLinks">
    <a id="tcgLink" class="linkButton" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">
      Buy on TCGplayer<span id="tcgPrice"></span>
    </a>

    <a id="scryfallLink" class="linkButton" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">
      Scryfall
    </a>
  </div>

  <div class="credit">
    Card data and images provided by Scryfall.
  </div>

  <script>
    const cardHistory = [];
    let historyPosition = -1;

    const cardName = document.getElementById("cardName");
    const setName = document.getElementById("setName");
    const cardImage = document.getElementById("cardImage");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const tcgLink = document.getElementById("tcgLink");
    const tcgPrice = document.getElementById("tcgPrice");
    const scryfallLink = document.getElementById("scryfallLink");

    function updateNavigationButtons() {
      previousButton.style.display = historyPosition > 0 ? "inline-flex" : "none";
      nextButton.style.display =
        historyPosition >= 0 && historyPosition < cardHistory.length - 1
          ? "inline-flex"
          : "none";
    }

    function displayCard(data) {
      cardName.textContent = data.name || "Unknown Card";
      setName.textContent = data.set_name || "";

      let imageUrl = data.image_uris?.normal;

      // Double-faced cards may store images under card_faces.
      if (!imageUrl && data.card_faces?.length) {
        imageUrl = data.card_faces[0].image_uris?.normal;
      }

      if (imageUrl) {
        cardImage.src = imageUrl;
        cardImage.alt = data.name || "Magic: The Gathering card";
        cardImage.style.display = "inline-block";
      } else {
        cardImage.removeAttribute("src");
        cardImage.alt = "Card image unavailable";
        cardImage.style.display = "none";
      }

      const tcgplayerUrl = data.purchase_uris?.tcgplayer;
      const normalPrice = data.prices?.usd;

      if (tcgplayerUrl) {
        tcgLink.href = tcgplayerUrl;
        tcgLink.style.display = "inline-flex";
        tcgPrice.textContent = normalPrice
          ? " ($" + normalPrice + ")"
          : " (Price unavailable)";
      } else {
        tcgLink.removeAttribute("href");
        tcgPrice.textContent = " (Unavailable)";
        tcgLink.style.display = "inline-flex";
      }

      if (data.scryfall_uri) {
        scryfallLink.href = data.scryfall_uri;
        scryfallLink.style.display = "inline-flex";
      } else {
        scryfallLink.removeAttribute("href");
        scryfallLink.style.display = "none";
      }

      updateNavigationButtons();
    }

    async function getRandomCard() {
      try {
        cardName.textContent = "Loading...";
        setName.textContent = "";
        cardImage.style.display = "none";

        const q = "lang:en -is:token -t:basic -is:art_series -set:ugl -set:unh -set:ust -set:unf -set:und";
        const response = await fetch(
          "https://api.scryfall.com/cards/random?q=" + encodeURIComponent(q),
          {
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (!response.ok) {
          throw new Error("Scryfall request failed");
        }

        const data = await response.json();

        // If we previously moved backward, discard the cards that were ahead
        // of our current position before adding this new random card.
        if (historyPosition < cardHistory.length - 1) {
          cardHistory.splice(historyPosition + 1);
        }

        cardHistory.push(data);
        historyPosition = cardHistory.length - 1;

        displayCard(data);
      } catch (error) {
        console.error(error);
        cardName.textContent = "Unable to load card";
        setName.textContent = "Please try again.";
        updateNavigationButtons();
      }
    }

    function showPreviousCard() {
      if (historyPosition > 0) {
        historyPosition--;
        displayCard(cardHistory[historyPosition]);
      }
    }

    function showNextCard() {
      if (historyPosition < cardHistory.length - 1) {
        historyPosition++;
        displayCard(cardHistory[historyPosition]);
      }
    }
  </script>

</body>
</html>
